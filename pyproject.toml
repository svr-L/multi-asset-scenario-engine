[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-asset-scenario-engine"
version = "0.20.0"
description = "Cross-asset physical-measure scenario generation, horizon repricing, and portfolio tail-risk analytics"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8", "scikit-learn>=1.3",
  "statsmodels>=0.14", "scipy>=1.11", "yfinance>=0.2", "pandas-datareader>=0.10"
]

[tool.setuptools.packages.find]
where = ["src"]
